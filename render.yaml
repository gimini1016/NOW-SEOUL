services:
  - type: web
    name: now-seoul
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.9
      - key: ALLOWED_ORIGINS
        value: "*"
      - key: TOUR_API_KEY
        sync: false
      - key: SEOUL_OPEN_DATA_KEY
        sync: false
